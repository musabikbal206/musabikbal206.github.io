<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The Teal to Violet Gradient matching your site -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- A soft glow filter for that "Elite" tech look -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background: Dark Slate (#0f172a) with Rounded Corners -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="#0f172a" />
  
  <!-- Subtle Gradient Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#mainGradient)" stroke-width="10" opacity="0.5" />

  <!-- Monogram text -->
  <text x="50%" y="50%" 
        font-family="sans-serif" 
        font-weight="900" 
        font-size="280" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="url(#mainGradient)"
        filter="url(#glow)"
        dy="15">MS</text>
</svg>
